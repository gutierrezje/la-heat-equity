crs: "EPSG:4326"
aoi:
    county_fips: "06037" # Los Angeles County
    bbox: [-119.05, 32.65, -117.55, 34.92] # padded LA County bounds (incl. Channel Islands)
sources:
    cooling:
        url: "https://services.arcgis.com/RmCCgQtiZLDCtblq/ArcGIS/rest/services/Cooling_Centers_-_Los_Angeles_County_Regional_(Official_-_Updated_July_2022)_(View)/FeatureServer/0/query"
    calheatscore:
        url: "https://services1.arcgis.com/PCHfdHz4GlDNAhBb/arcgis/rest/services/CalHeatScore_Live_Data_for_API_Use/FeatureServer/0/query"
    zcta:
        url: "https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/Census_ZIP_Code_Tabulation_Areas_2010_v1/FeatureServer/0/query"
    
    county_boundary:
        url: "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/13/query"
    svi:
        gdb: "SVI2022_CALIFORNIA_tract.gdb"
        layer: "SVI2022_CALIFORNIA_tract"
    mua:
        # HRSA Medically Underserved Areas. Used instead of HPSA, which has only ~2
        # usable area designations in LA County once withdrawn and population-group
        # designations are excluded (see D14). MapServer, not FeatureServer — HRSA's
        # FeatureServer endpoint is broken.
        url: "https://gisportal.hrsa.gov/server/rest/services/Shortage/MedicallyUnderservedAreas_FS/MapServer/0/query"
    places:
        # CDC PLACES 2024 release, ZCTA grain — already the project's join unit, so
        # no crosswalk is needed. Scoped by the AOI bbox via the `geolocation` point
        # (the dataset carries no state/county field); the ZCTA spine join defines
        # actual scope, per D2.
        url: "https://chronicdata.cdc.gov/resource/kee5-23sr.json"
        measures: # source field -> output column
            casthma_crudeprev: "asthma"
            copd_crudeprev: "copd"
            diabetes_crudeprev: "diabetes"
            phlth_crudeprev: "poor_phys_health"
paths:
    processed: "data/processed"
    raw: "data/raw"
    # Dated archive of snapshots that cannot be re-fetched (CalHeatScore serves
    # only the current 7-day window, so an overwritten pull is gone for good).
    history: "data/history"
score:
    # Each component population-weighted percentile-ranks every column it lists, then
    # averages those percentiles. A single-column component is just its own percentile;
    # `chronic` is the mean of its four condition percentiles. Components are combined
    # by weight and the weights must sum to 1.
    #
    # Equal weights are a placeholder pending mentor review (see D7).
    components:
        heat:
            columns: [heat_risk]
            weight: 0.25
        svi:
            columns: [svi]
            weight: 0.25
        chronic:
            columns: [asthma, copd, diabetes, poor_phys_health]
            weight: 0.25
        resource_gap:
            columns: [dist_m]
            weight: 0.25
